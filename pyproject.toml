[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fxi"
version = "0.1.0"
description = "Fxi - Novel Knowledge Base and Dynamic World State Center"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "jieba>=0.42.1",
    "httpx>=0.24.0",
    "json_repair>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
kb = "fxi.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
