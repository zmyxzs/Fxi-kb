relationships:
- dynamic: 监护人与被监护者、亲属
  interpersonal_attitude:
    姨妈: 牵挂、疼爱并担忧林七夜，除夕仍坚持打电话确认他是否吃上年夜饭。
    林七夜: 深切依恋、感激并保护姨妈，即使无法接听电话也把她的安危置于首位。
