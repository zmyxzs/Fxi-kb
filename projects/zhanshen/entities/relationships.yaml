  tension: 蒋倩最初以班长身份热情照顾林七夜，甚至代表同学向姨妈保证会护送他；但鬼面人出现后，恐惧使她和其他同学本能逃生，林七夜也因此看见了表面善意在生死压力下的脆弱。两人的关系从集体照顾转为共同面对死亡的紧张关系。
