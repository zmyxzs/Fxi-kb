narrative_cadence:
  paragraph_length: 极短段落为主，多数10~40字，大量单句成段，形成漫画分镜式快切节奏
  pacing: 极简白描驱动，重动词轻修饰，对白高密度推进，情感场景切换为长句倾吐，动静交替鲜明
metaphors:
  preferred_style: 接地气具象比喻，生活物理反差感强，拒绝文艺腔抽象化
  examples:
  - 一个黑缎缠目的少年就像是饺子的馅肉，被包裹的严严实实
  - 他不想姨妈出事，哪怕只是莫名其妙的玄学逻辑，他也不愿去冒这个险。所以，他很干脆的把这个flag拔了出来，撕吧撕吧丢进了太平洋
  - 脸上的皱纹就像是花儿般绽放，四十多岁的她，笑的像是个孩子
  banned_abstract_metaphors:
  - 伤口
  - 深渊
  - 星辰
  - 风吹散沉重
  - 指节发白
  - 瞳孔地震
  - 心跳漏了一拍
punctuation_and_dialogue:
  habits:
  - 破折号+感叹号制造音效定格（滴滴滴——！啪嗒——！吱嘎——！）
  - 省略号承载沉默/无语/欲言又止（林七夜：……、李毅飞：……）
  - 对白单次高密度吐露，信息量密集不拖沓
  - 表里双轨结构：表面克制少言，内心冷硬事实推演并行
  - 对话直截入话与零声学解说律（Zero Vocal Padding）：彻底封杀一切“声音/嗓音/语调 + 形容词”（禁止声音很闷、发紧、发涩、沙哑、微颤等，无论接冒号还是句号）；提倡对白先发或纯骨架动作，台词即情绪。
  - 彻底封杀AI式伪具体与慢动作文学腔（Anti-Pseudo-Concreteness）：严禁身体部位形容词化（严禁粗糙的手指、修长的指节、动了动的嘴唇、紧抿嘴角）；严禁把简单动作慢放拆解（严禁慢慢剥开、沙沙声格外清晰）；动词干净推进。
  - 道具物证边界规范：常规穿戴服饰（校服、外套、长裤）属于默认立绘背景，绝不可作为强制微观交互道具，严禁为了与服饰互动硬编抠拉链、攥衣角。
epistemic_worldview:
  fourth_wall_policy: meta_aware
  worldview_type: modern_native_urban
  protagonist_identity: transmigrator
  prohibited_meta_words:
  - 活不过三章
  - 主角光环
  - 剧本
  - 穿书
  - 系统
  - 反派死于话多
lexicon_governance:
  worldview_genre: urban_superpower
  universal_ai_cliches_banned:
  - 扯出一抹笑意
  - 扯出一抹笑容
  - 嘴角扯出
  - 指节隐隐发白
  - 任由风
  - 吹散了沉重
  - 底层逻辑
  - 抓手
  - 闭环
  - 赋能
  - 颗粒度
  genre_anachronisms_banned:
  - 本座
  - 道友
  - 贫道
  - 老夫
  - 小友
  - 金丹
  - 元婴
  - 宗门
  - 修仙界
  permitted_monologue_slang:
  - 生活化吐槽
  - 高中生网文调侃
  - 反套路冷幽默
  strict_dialogue_taboos:
  - 脱口秀相声捧哏
  - 五险一金
  - 老天爷失恋
  - 现代HR推销
tonal_gravity_rules:
  humor_function: 反差减震器与掩饰沉重的笨拙自嘲，绝非滑稽相声
  emotional_protection: 在亲情、自责、告别、牺牲语境下，严禁轻浮调侃与脱口秀抬杠
detail_vs_ellipsis_cadence:
  detail_focus:
  - 情感倾吐长句慢写
  - 感官冷暖置换细节
  - 核心实体动作干净白描推进
  ellipsis_focus:
  - 时间跨度过渡一笔带过
  - 逻辑推演直奔结论不拉扯
  - 次要人物背景简略交代
  cliffhanger_cutoff: 在关键信息揭露或重大反转瞬间骤停截断，严禁余波废话
scene_budget_model:
  average_chapter_words: 1800
  setup_words:
  - 600
  - 750
  pressure_words:
  - 450
  - 600
  hook_words:
  - 350
  - 500
negative_anti_patterns:
- 严禁网络油腻烂梗堆砌（如'老铁666''蚌埠住了''绝绝子'等过时网红词）
- 严禁翻译腔与AI味废话（如'空气中弥漫着一种说不清道不明的氛围'）
- 严禁傲慢龙王式装逼台词（如'区区蝼蚁也敢挡我'等中二感过重表述）
- 严禁慢动作文学腔与硬造微观声学描写
- 严禁正经情感场景中展开滑稽段子破坏情绪重力
- 严禁套路化小媳妇抓马、AI伪具体与全域声学解说：严禁一切“声音/嗓音/语调+形容词”；严禁给身体部位加修饰词（粗糙的手指、动了动的嘴唇）；严禁慢动作文学腔与硬造感官（慢慢剥开、沙沙声格外清晰）。
positive_exemplars:
- id: ex_campus_01
  scene_type: campus_dialogue
  tags:
  - 日常拌嘴
  - 反套路
  - 少年群像
  description: 校园日常中林七夜被同学簇拥的反套路温情场景，以轻松对话消解盲人转学生的尴尬设定，展现市井少年的真实互动质感
  text: '“林七夜同学，我是这个班的班长蒋倩，有什么事情可以找我。”一个扎着马尾的女生拍着胸脯说道。

    “我叫李毅飞，去吃饭的话喊我一声，我带你去。”那个帮着他拿包的男人笑道。

    “还有我，我叫汪绍……”

    “……”

    许许多多人簇拥在他的身边，热情的跟他打着招呼。

    一时之间，林七夜竟然有些茫然。

    说实话，这和他的想象差的挺多的。

    “你们，认识我？”林七夜表情有些古怪。'
- id: ex_family_warmth_01
  scene_type: family_warmth
  tags:
  - 亲情
  - 情感高潮
  - 反套路温情
  description: 林七夜恢复视力后向姨妈宣告的重大情感场景，用极简动作与对白承载十年隐忍后的爆发，姨妈的反应层层递进，最后以'踢哒声'与'轻快步伐'收尾，克制而有力
  text: '“姨妈！我能看见了！！”

    下一刻，林七夜听到楼下的踢哒声突然停顿，然后姨妈的声音从五楼之下颤巍巍的传上来。

    “你，你再说一遍？！”

    “我能看见了！我好了！姨妈！”

    短暂的停顿之后，一阵比下楼更加急促的上楼声从下方传来，没多久，气喘吁吁的姨妈就站在了林七夜的面前。

    她的嘴唇微微颤抖，嘴角却控制不住的上扬……

    “能看见了？真的？”

    “真的。”

    “模糊吗？有重影吗？疼不疼？照到光还会不会刺痛？”

    “没有，都没有，姨妈。”林七夜嘴角上扬，伸手解开了眼上的黑缎，一双极其漂亮的眸子缓缓睁开，"我真的好了，姨妈。"'
- id: ex_dialogue_banter_01
  scene_type: dialogue
  tags:
  - 毒舌机敏
  - 老兵吹牛
  - 反套路解构
  description: 赵空城与林七夜经典的毒舌交锋，以老兵自恋与少年'容易死'反差击碎装逼，真实接地气
  text: '过了许久，赵空城终于忍不住了，率先开口：
    “我刚刚帅吗？”
    林七夜：……
    林七夜盯着他的眼睛看了片刻，发现他居然是认真的，只能幽幽开口：“帅。”
    “帅就对了。”赵空城嘿嘿一笑，“想变得跟我一样帅吗？”
    “不想。”
    “……”赵空城嘴角微微抽搐，“为什么？”
    “容易死。”
    林七夜的表情很认真。
    赵空城一时之间竟然有些语塞，“可是你刚刚也看到了，你拥有寻常人梦寐以求的超自然力量，你就不想像电影里那样，当个超级英雄？”
    “不想。”
    “……因为容易死？”
    “对。”'
- id: ex_dialogue_storytelling_01
  scene_type: dialogue
  tags:
  - 往事倾诉
  - 第一人称连贯台词
  - 沧桑老兵情感
  description: 赵空城第一人称口语讲述当年离家往事，长短句自然流淌，少年冷面接话与适度留白
  text: '赵空城将身子靠在椅背上，眼中浮现出一抹追忆。
    “我年轻的时候，也和你一样。”
    “说真的，这个开场有点老套。”
    “……”赵空城无奈翻了个白眼，“没事，你继续听。”
    “六岁那年，我父亲就因病去世了，我妈一个人打两份工，才勉强把我拉扯大。”赵空城的手摩擦着烟盒，声音十分平静。
    “那个年代的节奏很慢，当时我妈对我的期望就是，好好读完初中，然后回来当个村干部，娶个小媳妇，生几个娃，一家子在一起快快乐乐的生活。
    你知道，少年人，总是有叛逆期的。
    初中毕业的时候我成绩还不错，但我却不顾她的反对，毅然去当了兵。我离家那天她站在门口，就这么默默的看着我，我走到屋子后面的路上，她在看着我，我走到村门口，她还在看着我……
    后来我走到市里的车站，放不下心，偷偷溜回去看了一下……发现她还是站在那，看着我走的方向，在发呆。
    说真的，那时候我真的想过就这么留下，不走了，可最后还是狠了狠心，去当了兵。”'
- id: ex_dialogue_01
  scene_type: dialogue
  tags:
  - 严肃交锋
  - 世界观揭露
  - 信息密度高
  description: 赵空城向林七夜解释禁墟与神明体系的严肃对白场景，以连珠炮弹式问答推进世界观，节奏紧凑无废话，最后以'一直在'制造情感与悬念的双重重击
  text: '“也有人说……”

    林七夜忍不住问道 ：“有人说什么？”

    “也有人说……他们一直在。”

    “一直在？”

    “你觉得，为什么整个地球都被迷雾吞噬，只有大夏幸存？那迷雾已经来到了大夏周围，但就是被挡在国境线旁，寸土不得进？”

    林七夜张大了嘴巴，“你是说……”

    “这只是一种猜测，或者说……是一种美好的幻想。”赵空城摇了摇头，“不管怎么说，我们都没有发现过大夏神明的踪迹。”'
- id: ex_combat_01
  scene_type: combat
  tags:
  - 肃清行动
  - 禁墟设定
  - 氛围营造
  description: 赵空城执行禁墟封锁任务的肃清行动场景，以血滴、红光、三角形几何构图营造冷峻神秘氛围，动作干脆利落无废话，结尾'鬼面人肃清行动，开始'戛然而止
  text: '男人叼着烟，迈步走到告示牌的面前，将大拇指放在牙尖，用力一咬！

    一滴血珠从伤口溢出，男人蹲下身，用染着鲜血的大拇指在“前方禁行”四个大字上划了一道长长的横线！

    他的眼神一凝，一股莫名的气势以他为中心爆发而出！

    他抬头仰望黑色的夜空，用只有他自己能听见的声音呢喃……

    “禁墟，【无戒空域】。”

    下一刻，他身前的告示牌上鲜红的血痕飞速褪色，像是被吸收了一般，紧接着，“前方禁行”四个大字红芒乍闪！

    然后逐渐恢复原样。

    与此同时，在这三角形的中央，六道黑红色的斗篷如同闪电般划过天际！

    为首的那个男人抬头仰望暗红色的天穹，伸手握住了背后的刀柄，双眸微微眯起。

    “鬼面人肃清行动，开始。”'
work_id: zhanshen
