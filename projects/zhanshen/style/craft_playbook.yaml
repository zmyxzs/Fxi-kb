author_name: 三九音域
style_tagline: 市井烟火气为底，反套路毒舌为锋，极简动词白描为骨，悲壮英雄主义为魂
dialogue_dynamics:
  formula: 起调制造预期（吹牛、煽情、装深沉或一本正经）→现实戳破（用极短、低情绪、带生活常识的回应拆台）→停顿留白（以省略号、沉默、错愕或微动作呈现对方吃瘪）→情感落地（不再解释大道理，而是用一个具体决定、一个动作或一句朴素话完成关系确认）。
  rules:
  - 让对白承担关系攻防，而不是承担背景说明；每一句话都应改变一次人物之间的心理距离、权力位置或情绪温度。
  - 先让一方主动建立话语姿态，再由另一方用现实细节而非宏大反驳将其击穿。越是沉重、煽情或英雄化的铺垫，越适合用平常话、冷脸回应或不合时宜的生活逻辑拆解。
  - 对白中的真正情绪不要全部说完。重要情感通常只说七成，剩余三成交给停顿、视线、脚步声、递物或拒绝来完成。
  - 使用短回合交锋：一句发起、一句反击、一个停顿、一个动作。避免连续多轮完整论证，否则人物会从自然交谈变成作者借角色演讲。
  subversion_techniques:
  - 反英雄化：强者并不持续保持冷峻神秘，而会抽烟、赶路、说家常、被一句现实话噎住，使超凡身份落回普通人的生活肌理。
  - 反煽情：先把情绪推向死亡、牺牲或悔恨的方向，再用改嫁、松了一口气等不体面却合理的事实修正读者预期，让悲伤变得更真实。
  - 反对称攻防：并非每次交锋都由语言完成胜负；有时一方说完后，另一方只用沉默、白眼或动作完成反击，形成松弛的生活化节奏。
emotional_storytelling:
  perspective: 采用人物第一人称连贯口述，让往事像被压在心底很久后终于打开的生活记忆，而不是由作者站在上帝视角整理成履历。讲述者可以平静、绕弯、自嘲，甚至在最痛处短暂停顿；听者只负责少量追问和误判，由此保留真实谈话的不完整感。
  grounding_props:
  - 烟盒与烟：老兵的生活物件与叙事缓冲器，摩擦、掏出、点燃或迟迟没有点燃替代直接书写紧张和难以启齿
  - 装馒头的生活布袋：把贫困、劳作和亲情压缩进一个可触摸的物件
  - 牛皮纸袋与钱：将照顾、愧疚、补偿和尊严集中到一次递出与拒绝中
  - 门口、村路、车站：用空间中的反复目送承载离别，不必反复写哭泣或不舍
  - 白天劳作、晚上缝衣、站着发呆：通过生活节律表现长辈的消耗与等待
  rules:
  - 沉重往事必须由讲述者自己说出口，并保留口语中的停顿、重复、转折和不够漂亮的表达。口述的不规整感会增加可信度。
  - 按照生活顺序推进，而不是按照主题顺序总结：童年、母亲的愿望、离家、回望、事业变化、再次回家。时间链越朴素，情感越容易沉淀。
  - 少写抽象评价，多写可验证的物证和行为。不要直接写母亲非常爱孩子，而写她站在不同地点持续目送；不要直接写生活艰难，而写工作、劳作和身体被熬坏。
  - 避免把长辈塑造成纯粹受害者或完美圣人。允许其有疲惫、现实选择、再婚、松一口气等复杂反应，真实人性往往通过不符合煽情期待的细节显现。
physical_anchoring:
  signature_actions:
  - 掏烟、点烟、吸烟或塞回烟盒
  - 摩擦烟盒、指腹蹭纹章背面刻痕
  - 递出牛皮纸袋后被推回
  - 低头沉默、猛地抬头、穿拖鞋冲出门
  - 关门、站在门口、转身离开
  prop_rituals:
  - 为关键道具建立重复仪式：烟盒代表整理情绪，纸袋代表援助与拒绝，门代表家庭边界，耳麦代表日常与任务世界的切换。
  - 道具的移动方向要有意义：递出意味着主动照顾，推回意味着保留尊严，揣入口袋意味着暂时隐藏，掉落意味着秘密暴露。
  - 让人物先接触道具，再表达态度。手指迟疑、拿起又放下、摸索、收回，都是可替代心理说明的行为。
  rules:
  - 抽象心理词出现前，至少安排一个身体动作或物件互动作为证据；能用动作表达时，不要先写‘他很紧张’‘他很愧疚’。
  - 动作与对白不要重复表达同一件事。人物说拒绝时，可以让他把纸袋推回；人物说没事时，可以让手仍在摩擦烟盒，以制造表里错位。
narrative_cadence:
  short_sentence_scenes:
  - 开篇视觉奇观或身份反差：用连续短句快速排列黑缎、盲杖、蔬菜、花生油等画面
  - 战斗、追逐、拔刀、斩击和危机反应：以短段落和强动词模拟镜头快切
  - 对白后的尴尬与情绪落点：用一句话、一个省略号、一个脚步停顿或一个关门动作制造空拍
  long_paragraph_scenes:
  - 老兵、长辈或核心角色讲述多年往事：允许时间线连续流动，让生活细节、选择、错过和后果逐层累积，不被过度分段切碎
  - 重大价值判断和关系确认：语言保留口语绕行和回忆铺垫，最后再落到当下的劝告或行动
  breathing_rules:
  - 段落长度服从注意力状态，不服从固定字数。高危处压缩，回忆处舒展，认知切换处留白。
  - 在长叙述前后安插极短的回应或动作，让听者、读者和人物共同换气。沉重往事之后用一句不合煽情预期的话重新接地。
  - 长句负责流动和积累，短句负责撞击和定格。严禁为了追求碎片化而机械使用单句分段！
cliffhanger_mechanics:
  formula: 先以雨声、车厢、抽烟、回家等低刺激日常建立安全感与静谧→逐渐压低人物动作和环境信息→用一个外部声音或异常信号突然侵入→先写手指、瞳孔、呼吸、脚步等身体反应→在读者最想知道来者是谁、发生了什么时截断，不立即解释后果。
  cutoff_rules:
  - 断章前必须先完成一次情绪降速。越是安静、规律、松弛的前置场景，突发信号造成的冲击越强。
  - 危机信号要尽量具体且简短：耳麦骤响、电话接通、门外异响、脚步突然停止，比泛泛的‘危险降临’更有临场感。
  - 让身体先知道，信息后到达。手颤、瞳孔收缩、呼吸停滞或动作僵住，是比解释性惊呼更高级的危机预告。
  - 截断点应位于信息揭示前一拍，而不是事件完全发生之后。
